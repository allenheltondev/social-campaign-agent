AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Persona Management API - REST API for managing personas and writing examples

Globals:
  Function:
    Runtime: nodejs24.x
    CodeUri: functions
    Architectures:
      - arm64
    Timeout: 15
    MemorySize: 1024
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: !Sub "'*'"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name

  AuthorizerArn:
    Type: String
    Default: ""
    Description: Optional ARN of existing Lambda authorizer. If not provided, internal authorizer will be created.

Conditions:
  CreateInternalAuthorizer: !Equals [!Ref AuthorizerArn, ""]

Metadata:
  esbuild-properties: &esbuild-properties
    Format: esm
    Minify: false
    OutExtension:
      - .js=.mjs
    Target: es2020
    Sourcemap: false
    EntryPoints:
      - index.mjs
    Banner:
      - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    External:
      - "@aws-sdk/*"
    Loader: []

Resources:
  PersonaTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Condition: CreateInternalAuthorizer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - auth/authorizer.mjs
    Properties:
      Handler: auth/authorizer.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: "*"
      Environment:
        Variables:
          TABLE_NAME: !Ref PersonaTable
          USER_POOL_ID: !Ref CognitoUserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient

  CampaignApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: Authorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          Authorizer:
            FunctionPayloadType: REQUEST
            FunctionArn:
              !If [
                CreateInternalAuthorizer,
                !GetAtt AuthorizerFunction.Arn,
                !Ref AuthorizerArn,
              ]
            Identity:
              Headers:
                - Authorization

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete
    Properties:
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: tenantId
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolTags:
        Project: CampaignAgent

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub campaign-agent-${Environment}
      UserPoolId: !Ref CognitoUserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
        - ALLOW_USER_AUTH
      AuthSessionValidity: 3
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 24
      IdTokenValidity: 24
      RefreshTokenValidity: 30
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - "http://localhost:5173"
      LogoutURLs:
        - "http://localhost:5173"
      SupportedIdentityProviders:
        - COGNITO

  ApiRouterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: api-router
    Properties:
      Runtime: provided.al2023
      Handler: bootstrap
      CodeUri: .
      Timeout: 25
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
              Resource:
                - !GetAtt PersonaTable.Arn
                - !Sub "${PersonaTable.Arn}/index/GSI1"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub "${BrandAssetsBucket.Arn}/*"
                - !Sub "${AssetsBucket.Arn}/*"
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Environment:
        Variables:
          TABLE_NAME: !Ref PersonaTable
          BRAND_ASSETS_BUCKET: !Ref BrandAssetsBucket
          ASSETS_BUCKET: !Ref AssetsBucket
          EVENT_BUS_NAME: default
      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref CampaignApi
            Path: /{proxy+}
            Method: ANY

  StyleInferenceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - agents/persona-inference.mjs
    Properties:
      Handler: agents/persona-inference.handler
      Timeout: 60
      MemorySize: 2048
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-*
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-*
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt PersonaTable.Arn
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Environment:
        Variables:
          TABLE_NAME: !Ref PersonaTable
          MODEL_ID: us.amazon.nova-pro-v1:0
      Events:
        StyleAnalysisRequest:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source: ["persona-management-api"]
              detail-type: ["Style Analysis Requested"]

  StyleAnalysisCompleteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - persona/events/style-analysis-complete.mjs
    Properties:
      Handler: persona/events/style-analysis-complete.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt PersonaTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref PersonaTable
      Events:
        StyleAnalysisCompletion:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source: ["persona-management-api"]
              detail-type: ["Style Analysis Completed"]

  BrandAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "campaign-agent-brand-assets-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - POST
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - "ETag"
            MaxAge: 3000

  BuildCampaignFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - campaign/build-campaign.mjs
    Properties:
      Handler: campaign/build-campaign.handler
      Timeout: 300
      DurableConfig:
        ExecutionTimeout: 604800 # 1 week
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchWriteItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
              Resource:
                - !GetAtt PersonaTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "${PersonaTable.Arn}/index/GSI1"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*
                - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-*
                - arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-*
            - Effect: Allow
              Action:
                - lambda:CreateDurableExecution
                - lambda:GetDurableExecution
              Resource: "*"
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${AssetsBucket.Arn}/*"
      Environment:
        Variables:
          TABLE_NAME: !Ref PersonaTable
          ASSETS_BUCKET: !Ref AssetsBucket
          PRESIGNED_URL_EXPIRY_SECONDS: 900
          # MODEL_ID: us.amazon.nova-pro-v1:0

  UpdateCampaignStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - campaign/update-status.mjs
    Properties:
      Handler: campaign/update-status.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt PersonaTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Environment:
        Variables:
          TABLE_NAME: !Ref PersonaTable
      Events:
        StatusUpdateRequest:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source: ["campaign-api", "campaign-planner", "content-generator"]
              detail-type: ["Campaign Status Update Request"]

  WorkflowCompletionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - campaign/events/workflow-completion.mjs
    Properties:
      Handler: campaign/events/workflow-completion.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt PersonaTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
      Environment:
        Variables:
          TABLE_NAME: !Ref PersonaTable
      Events:
        WorkflowCompletion:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            Pattern:
              source: ["campaign-planner", "content-generator"]
              detail-type:
                [
                  "Campaign Planning Completed",
                  "Campaign Planning Failed",
                  "Content Generation Completed",
                  "Content Generation Failed",
                ]

  AssetUploadCompleteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        <<: *esbuild-properties
        EntryPoints:
          - assets/upload-complete.mjs
    Properties:
      Handler: assets/upload-complete.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt PersonaTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectAttributes
              Resource: !Sub "${AssetsBucket.Arn}/*"
      Environment:
        Variables:
          TABLE_NAME: !Ref PersonaTable
          ASSETS_BUCKET: !Ref AssetsBucket
      Events:
        S3Upload:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref AssetsBucket

Outputs:
  PersonaApiUrl:
    Description: API Gateway endpoint URL for Persona Management API
    Value: !Sub "https://${CampaignApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  AssetsBucket:
    Description: S3 bucket for asset storage
    Value: !Ref AssetsBucket
